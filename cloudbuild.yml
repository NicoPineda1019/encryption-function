substitutions:
  _FUNCTION_NAME: gcp-encryption-cloud-function
  _REGION: us-east1
  _BUCKET: data-transfer-2026
  _TRIGGER_LOCATION: us-east1

steps:
  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - services
      - enable
      - cloudfunctions.googleapis.com
      - eventarc.googleapis.com
      - run.googleapis.com
      - artifactregistry.googleapis.com
      - pubsub.googleapis.com
      - storage.googleapis.com
      - cloudbuild.googleapis.com
      - --project=${PROJECT_ID}

  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - ${_FUNCTION_NAME}
      - --gen2
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --runtime=python312
      - --source=.
      - --entry-point=handle_storage_event
      - --trigger-location=${_TRIGGER_LOCATION}
      - --trigger-event-filters=type=google.cloud.storage.object.v1.finalized
      - --trigger-event-filters=bucket=${_BUCKET}
      - --min=1
      - --quiet
