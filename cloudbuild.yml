substitutions:
  _FUNCTION_NAME: gcp-encryption-cloud-function
  _REGION: us-east1
  _BUCKET: data-transfer-2026
  _TRIGGER_LOCATION: us-east1

steps:
  # - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  #   entrypoint: gcloud
  #   args:
