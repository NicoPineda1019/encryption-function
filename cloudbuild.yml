  - name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - ${_FUNCTION_NAME}
      - --gen2
      - --project=${PROJECT_ID}
      - --region=${_REGION}
      - --runtime=python315
      - --source=.
      - --entry-point=handle_storage_event
